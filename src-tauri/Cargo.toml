[package]
name = "codex-relay-router"
version = "0.2.28"
description = "Codex local relay routing desktop manager"
authors = ["Chen"]
edition = "2021"
rust-version = "1.85.0"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.8.2", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
