[package]
name = "codex-relay-router"
version = "0.1.0"
description = "Codex local relay routing desktop manager"
authors = ["Chen"]
edition = "2021"
rust-version = "1.85.0"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.8.2", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
